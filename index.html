<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant</title>
</head>

<body>

    <h1>Restaurant</h1>

    <h2>Pizza</h2>
    
    <img src="./images.jpg" width="150">
    <p>Delicious pizza.</p>
    <a href="https://en.wikipedia.org/wiki/Pizza">More</a>
    <details>
        <summary>Info</summary>
        <p>Cheese and tomato.</p>
    </details>
    <progress value="75" max="100"></progress>

    <h2>Burger</h2>
    <img src="./burger.jpg" width="150">
    <p>Tasty burger.</p>
    <a href="https://en.wikipedia.org/wiki/Hamburger">More</a>
    <details>
        <summary>Info</summary>
        <p>Meat and vegetables.</p>
    </details>
    <progress value="60" max="100"></progress>

    <h2>Pasta</h2>
    <img src="./image2.jpg" width="150">
    <p>Italian pasta.</p>
    <a href="https://en.wikipedia.org/wiki/Pasta">More</a>
    <details>
        <summary>Info</summary>
        <p>Pasta with sauce.</p>
    </details>
    <progress value="90" max="100"></progress>

    <h2>Status</h2>
    <meter value="80" min="0" max="100"></meter>

    <p><mark>Welcome to our restaurant!</mark></p>
    <p>Open at <time>10:00</time></p>


    <dialog open>
        <p>Do you want to join us?</p>
        <button>Yes</button>
        <button>No</button>
    </dialog>
</body>

</html>
